<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Bird Repeller Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex justify-between items-center bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
      <div>
        <h1 class="text-2xl font-bold text-amber-400"><i class="fa-solid fa-crow mr-2"></i>Smart Bird Repeller System</h1>
        <p class="text-slate-400 text-sm">Device Node: <span class="text-cyan-400 font-mono">/lab/iot-142/latest</span></p>
      </div>
      <div class="flex items-center gap-2 bg-emerald-500/10 text-emerald-400 px-4 py-2 rounded-full border border-emerald-500/30 text-sm font-semibold">
        <span class="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-ping"></span> Active System
      </div>
    </header>

    <!-- Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- 1. Detection Count -->
      <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-lg">
        <div class="flex justify-between items-center text-slate-400 mb-2">
          <span>จำนวนการตรวจเจอนก</span>
          <i class="fa-solid fa-calculator text-amber-400 text-xl"></i>
        </div>
        <div class="text-4xl font-bold text-white mb-1" id="val-detections">--</div>
        <div class="text-xs text-slate-500">ครั้ง (สะสม)</div>
      </div>

      <!-- 2. Repell Mode -->
      <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-lg">
        <div class="flex justify-between items-center text-slate-400 mb-2">
          <span>โหมดการไล่ปัจจุบัน</span>
          <i class="fa-solid fa-bullhorn text-rose-400 text-xl"></i>
        </div>
        <div class="text-xl font-bold text-rose-300 mb-1" id="val-mode">--</div>
        <div class="text-xs text-slate-500">สลับรูปแบบเพื่อกันนกชิน</div>
      </div>

      <!-- 3. Battery Level -->
      <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-lg">
        <div class="flex justify-between items-center text-slate-400 mb-2">
          <span>พลังงานแบตเตอรี่</span>
          <i class="fa-solid fa-battery-three-quarters text-emerald-400 text-xl"></i>
        </div>
        <div class="text-4xl font-bold text-white mb-1" id="val-battery">--</div>
        <div class="text-xs text-slate-500">ระบบชาร์จโซลาร์เซลล์</div>
      </div>

    </div>

    <!-- System Time Footer -->
    <div class="bg-slate-800/40 border border-slate-700/50 rounded-xl p-4 text-center text-slate-400 text-sm">
      อัปเดตข้อมูลล่าสุดเมื่อ: <span id="last-update" class="text-slate-200 font-mono">--</span>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://iot142-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);

    firebase.database().ref('lab/iot-142/latest').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('val-detections').innerText = data.detections != null ? data.detections : '0';
        document.getElementById('val-mode').innerText = data.mode || 'Standby';
        document.getElementById('val-battery').innerText = data.battery != null ? Math.round(data.battery) + '%' : '--';
        
        if (data.timestamp) {
          const date = new Date(data.timestamp * 1000);
          document.getElementById('last-update').innerText = date.toLocaleTimeString('th-TH');
        }
      }
    });
  </script>
</body>
</html>
