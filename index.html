<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Realtime Dashboard - iot-142</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Header -->
    <header class="flex justify-between items-center bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
      <div>
        <h1 class="text-2xl font-bold text-cyan-400"><i class="fa-solid fa-microchip mr-2"></i>IoT Realtime Dashboard</h1>
        <p class="text-slate-400 text-sm">Database Node: <span class="text-amber-400 font-mono">/lab/iot-142</span></p>
      </div>
      <div class="flex items-center gap-2 bg-emerald-500/10 text-emerald-400 px-4 py-2 rounded-full border border-emerald-500/30 text-sm font-semibold">
        <span class="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-ping"></span> Live Realtime
      </div>
    </header>

    <!-- 6 Columns Dashboard Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      
      <!-- 1. Temperature -->
      <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-lg">
        <div class="flex justify-between items-center text-slate-400 mb-2">
          <span>Temperature</span>
          <i class="fa-solid fa-temperature-high text-rose-400 text-xl"></i>
        </div>
        <div class="text-4xl font-bold text-white mb-1" id="val-temp">--</div>
        <div class="text-xs text-slate-500">หน่วย: °C</div>
      </div>

      <!-- 2. Humidity -->
      <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-lg">
        <div class="flex justify-between items-center text-slate-400 mb-2">
          <span>Humidity</span>
          <i class="fa-solid fa-droplet text-blue-400 text-xl"></i>
        </div>
        <div class="text-4xl font-bold text-white mb-1" id="val-hum">--</div>
        <div class="text-xs text-slate-500">หน่วย: %</div>
      </div>

      <!-- 3. Light -->
      <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-lg">
        <div class="flex justify-between items-center text-slate-400 mb-2">
          <span>Light Level</span>
          <i class="fa-solid fa-sun text-amber-400 text-xl"></i>
        </div>
        <div class="text-4xl font-bold text-white mb-1" id="val-light">--</div>
        <div class="text-xs text-slate-500">หน่วย: lx</div>
      </div>

      <!-- 4. Soil Moisture -->
      <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-lg">
        <div class="flex justify-between items-center text-slate-400 mb-2">
          <span>Soil Moisture</span>
          <i class="fa-solid fa-seedling text-emerald-400 text-xl"></i>
        </div>
        <div class="text-4xl font-bold text-white mb-1" id="val-soil">--</div>
        <div class="text-xs text-slate-500">หน่วย: %</div>
      </div>

      <!-- 5. CO2 Level -->
      <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-lg">
        <div class="flex justify-between items-center text-slate-400 mb-2">
          <span>CO2 Level</span>
          <i class="fa-solid fa-wind text-purple-400 text-xl"></i>
        </div>
        <div class="text-4xl font-bold text-white mb-1" id="val-co2">--</div>
        <div class="text-xs text-slate-500">หน่วย: ppm</div>
      </div>

      <!-- 6. Status & Time -->
      <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-lg">
        <div class="flex justify-between items-center text-slate-400 mb-2">
          <span>System Status</span>
          <i class="fa-solid fa-heart-pulse text-cyan-400 text-xl"></i>
        </div>
        <div class="text-2xl font-bold text-cyan-300 mb-1" id="val-status">--</div>
        <div class="text-xs text-slate-500">Timestamp: <span id="last-update">--</span></div>
      </div>

    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://iot142-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);

    // ดึงข้อมูล Realtime จาก node /lab/iot-142/latest
    firebase.database().ref('lab/iot-142/latest').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('val-temp').innerText = data.temp != null ? data.temp.toFixed(1) : '--';
        document.getElementById('val-hum').innerText = data.humi != null ? data.humi.toFixed(1) : '--';
        document.getElementById('val-light').innerText = data.light != null ? Math.round(data.light) : '--';
        document.getElementById('val-soil').innerText = data.soil != null ? Math.round(data.soil) : '--';
        document.getElementById('val-co2').innerText = data.co2 != null ? Math.round(data.co2) : '--';
        document.getElementById('val-status').innerText = data.status || 'Normal';
        
        if (data.timestamp) {
          const date = new Date(data.timestamp * 1000);
          document.getElementById('last-update').innerText = date.toLocaleTimeString('th-TH');
        }
      }
    });
  </script>
</body>
</html>
